<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FileHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Theme = hue + colour strength. Accent = two colours for the gradient. */
  --h:250; --sat:1; --accent:#ff7a4d; --accent2:#ff6a3d; --accent1:#ff9466;
  --bg:hsl(var(--h) calc(38% * var(--sat)) 94%); --panel:#ffffff;
  --panel2:hsl(var(--h) calc(45% * var(--sat)) 97.5%); --line:hsl(var(--h) calc(38% * var(--sat)) 92%);
  --text:hsl(var(--h) calc(25% * var(--sat)) 28%); --muted:hsl(var(--h) calc(14% * var(--sat)) 59%);
  --hover:hsl(var(--h) calc(45% * var(--sat)) 96.5%);
  --tint:hsl(var(--h) calc(40% * var(--sat)) 30%);
  --accent-soft:color-mix(in srgb,var(--accent) 13%,var(--panel));
  --accent-grad:linear-gradient(135deg,var(--accent1),var(--accent2));
  --accent-glow:0 6px 16px -6px color-mix(in srgb,var(--accent2) 60%,transparent);
  --violet:#8b7cf6; --violet-soft:#eeebff;
  --shadow:0 1px 2px color-mix(in srgb,var(--tint) 6%,transparent),0 8px 24px -8px color-mix(in srgb,var(--tint) 16%,transparent);
  --shadow-lg:0 2px 4px color-mix(in srgb,var(--tint) 6%,transparent),0 16px 40px -12px color-mix(in srgb,var(--tint) 26%,transparent);
  --pdf:#ff6b6b; --word:#6c8cff; --slides:#ffa046; --sheets:#34c38f; --img:#a77bf3;
  --video:#f06595; --audio:#3cc4d9; --other:#9a98b5;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:hsl(var(--h) calc(33% * var(--sat)) 12.5%); --panel:hsl(var(--h) calc(28% * var(--sat)) 17%);
  --panel2:hsl(var(--h) calc(26% * var(--sat)) 21%); --line:hsl(var(--h) calc(27% * var(--sat)) 27%);
  --text:hsl(var(--h) calc(40% * var(--sat)) 95%); --muted:hsl(var(--h) calc(20% * var(--sat)) 70%);
  --hover:hsl(var(--h) calc(25% * var(--sat)) 23%);
  --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--panel));
  --violet:#a497ff; --violet-soft:#2f2b55;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px -8px rgba(0,0,0,.45);
  --shadow-lg:0 2px 4px rgba(0,0,0,.25),0 16px 40px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:hsl(var(--h) calc(33% * var(--sat)) 12.5%); --panel:hsl(var(--h) calc(28% * var(--sat)) 17%);
  --panel2:hsl(var(--h) calc(26% * var(--sat)) 21%); --line:hsl(var(--h) calc(27% * var(--sat)) 27%);
  --text:hsl(var(--h) calc(40% * var(--sat)) 95%); --muted:hsl(var(--h) calc(20% * var(--sat)) 70%);
  --hover:hsl(var(--h) calc(25% * var(--sat)) 23%);
  --accent-soft:color-mix(in srgb,var(--accent) 20%,var(--panel));
  --violet:#a497ff; --violet-soft:#2f2b55;
  --shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px -8px rgba(0,0,0,.45);
  --shadow-lg:0 2px 4px rgba(0,0,0,.25),0 16px 40px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Nunito",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr);height:100vh;height:100dvh;overflow:hidden}
/* Sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;overflow-y:auto;overscroll-behavior:contain;min-height:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;padding:0 8px 16px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#8f6bff);display:grid;place-items:center;color:#fff}
.nav-h{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px}
.nav button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--text)}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav button .n{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.nav svg{width:17px;height:17px;flex:none}
/* Main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.top{flex:none;display:flex;gap:10px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
/* page heading: stays put while the files scroll */
.phead{flex:none;padding:18px 22px 0;border-bottom:1px solid var(--line);background:var(--bg)}
.phead .chips{margin:0 0 14px}
.phead .crumbs{margin:0 0 12px}
.phead:empty{display:none}
/* status bar at the bottom, like Finder */
.status{flex:none;display:flex;gap:14px;align-items:center;padding:6px 22px;border-top:1px solid var(--line);background:var(--panel);font-size:12px;color:var(--muted);min-height:30px}
.status .sel-name{margin-left:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%;color:var(--text)}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0 12px;max-width:560px}
.search input{flex:1;border:0;background:none;outline:none;padding:9px 0}
.search kbd{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.ctl{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}
.ctl:hover{background:var(--hover)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:7px 10px;cursor:pointer;display:grid;place-items:center}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
.seg svg,.ctl svg{width:16px;height:16px;display:block}
.content{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:18px 22px 30px}
.title{display:flex;align-items:baseline;gap:12px;margin:0 0 4px}
.title h1{font-size:22px;margin:0;font-weight:650}
.sub{color:var(--muted);margin:0 0 14px}
.section{margin-bottom:26px}
.section-h{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-weight:600}
.section-h .count{color:var(--muted);font-weight:400;font-size:13px}
.section-h .folder{color:var(--muted);font-weight:400;font-size:12px;margin-left:auto;cursor:pointer}
.family{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(164px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;position:relative}
.family .card{background:var(--panel2)}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.thumb{height:118px;background:var(--panel2);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line)}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;opacity:0;transition:opacity .2s}
.thumb img.ok{opacity:1}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#fff;border-radius:5px;padding:2px 6px}
.thumb .badge{position:absolute;top:8px;left:8px}
.pages{position:absolute;top:92px;right:8px;font-size:11px;font-weight:650;background:rgba(20,24,32,.78);color:#fff;border-radius:6px;padding:2px 7px;backdrop-filter:blur(4px)}
.meta{padding:9px 11px 11px}
.name{font-weight:550;font-size:13px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.9em;word-break:break-word}
.info{font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pin{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:7px;border:0;background:var(--panel);display:none;place-items:center;cursor:pointer;box-shadow:var(--shadow)}
.card:hover .pin,.pin.on{display:grid}
.pin.on{color:#f0a500}
.pin svg{width:15px;height:15px}
/* list view */
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:clip}
.family .list{border:0;background:none}
.row{display:grid;grid-template-columns:34px 1fr 200px 110px 70px;gap:12px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row.hd{position:sticky;top:-18px;z-index:2;background:var(--panel2);cursor:default;padding-top:7px;padding-bottom:7px;font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row.hd:hover{background:var(--panel2)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--accent-soft)}
.row .ic{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase}
.row .nm{min-width:0}
.row .nm div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .c{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Preview panel */
.prev{width:0;overflow:hidden;min-height:0;background:var(--panel);border-left:1px solid var(--line);transition:width .2s}
.prev.open{width:400px}
.prev-in{width:400px;height:100%;display:flex;flex-direction:column}
.prev-top{flex:none;display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);gap:8px}
.prev-top b{flex:1;font-size:13px;color:var(--muted);font-weight:500}
.x{border:0;background:none;cursor:pointer;padding:4px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--hover)}
.stage{height:330px;flex:none;background:var(--panel2);display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);overflow:hidden}
.stage iframe,.stage video{width:100%;height:100%;border:0;background:#fff}
.stage img{max-width:100%;max-height:330px;object-fit:contain}
.pbody{padding:16px;overflow-y:auto;overscroll-behavior:contain;flex:1;min-height:0}
.pbody h2{font-size:16px;margin:0 0 4px;word-break:break-word}
.actions{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:7px 12px;cursor:pointer;font-weight:550;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
dl{display:grid;grid-template-columns:96px 1fr;gap:7px 10px;margin:0;font-size:13px}
dt{color:var(--muted)} dd{margin:0;word-break:break-word}
dd a{color:var(--accent)}
.rel{margin-top:18px}
.rel h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.rel button{all:unset;box-sizing:border-box;display:flex;gap:9px;align-items:center;width:100%;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.rel button:hover{background:var(--hover)}
.rel .ic{width:22px;height:22px;border-radius:5px;flex:none;font-size:8px;font-weight:700;color:#fff;display:grid;place-items:center;text-transform:uppercase}
.rel span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:60px 20px}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.loading{display:flex;align-items:center;gap:10px;color:var(--muted);padding:40px 0;justify-content:center}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%)}
/* Split window */
.modal{position:fixed;inset:0;background:rgba(10,14,22,.45);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:20;padding:24px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(1180px,100%);height:min(820px,100%);display:flex;flex-direction:column;overflow:hidden}
.mhead{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:16px;margin:0}
.mhead .fn{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.mbody{flex:1;display:grid;grid-template-columns:1fr 340px;min-height:0}
.pages-grid{overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile,170px),1fr));align-items:start;gap:14px;align-content:start;background:var(--panel2)}
.pg{cursor:pointer;border-radius:10px;padding:6px;border:2px solid transparent;transition:opacity .15s,border-color .15s;user-select:none}
.pg .im{background:#fff;border-radius:5px;box-shadow:var(--shadow);overflow:hidden;min-height:80px;position:relative}
.pg img{width:100%;height:auto;display:block}
.pg .zm{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:8px;border:0;background:rgba(20,24,32,.75);color:#fff;display:none;place-items:center;cursor:zoom-in}
.pg:hover .zm{display:grid}
.pg .zm svg{width:15px;height:15px}
.pg .no{text-align:center;font-size:12px;font-weight:600;margin-top:5px;color:var(--muted)}
.pg.in{border-color:var(--accent);background:var(--accent-soft)}
.pg.in .no{color:var(--accent)}
.pg.out{opacity:.7}
.pg.edge .no::after{content:" ●";color:var(--accent)}
.mside{border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.big{min-height:200px;max-height:46vh;background:var(--panel2);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;position:relative}
.big img{max-width:100%;max-height:46vh;object-fit:contain;background:#fff;display:block}
.big .lbl{position:absolute;left:8px;top:8px;font-size:11px;font-weight:650;background:rgba(20,24,32,.75);color:#fff;border-radius:6px;padding:2px 7px}
.tsize{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:12px;color:var(--muted)}
.tsize .seg button{padding:4px 9px;font-size:12px}
.zoom{position:fixed;inset:0;z-index:40;background:rgba(8,10,16,.92);display:none;flex-direction:column}
.zoom.on{display:flex}
.zbar{display:flex;align-items:center;gap:10px;padding:12px 16px;color:#fff}
.zbar b{font-weight:600}
.zbar .sp{flex:1}
.zbar .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff}
.zbar .btn:hover{background:rgba(255,255,255,.2)}
.zbar .btn.primary{background:var(--accent);border-color:var(--accent)}
.zstage{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:0 60px 30px}
.zstage img{width:min(100%,var(--zw,1100px));height:auto;background:#fff;border-radius:4px;box-shadow:0 10px 40px rgba(0,0,0,.5);transition:width .15s}
.znav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:12px;background:rgba(255,255,255,.12);color:#fff;font-size:26px;cursor:pointer}
.znav:hover{background:rgba(255,255,255,.25)}
.znav.l{left:10px}.znav.r{right:10px}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.pager button{border:1px solid var(--line);background:var(--panel2);border-radius:7px;width:30px;height:28px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.stage.pdf{cursor:zoom-in}
.range{display:flex;gap:10px;align-items:end}
.range label{flex:1;font-size:12px;color:var(--muted);font-weight:600}
.range input{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);font-size:15px;font-weight:600}
.range input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.summary{font-size:14px;font-weight:600}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick .chip{font-size:12px;padding:4px 10px}
.done{background:var(--accent-soft);border-radius:10px;padding:12px;font-size:13px}
.done b{display:block;margin-bottom:6px;word-break:break-word}
/* saving + result */
.mbox{position:relative}
.busy,.mresult{position:absolute;inset:0;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:5}
.busy.on,.mresult.on{display:flex}
.busy .bx{display:flex;flex-direction:column;align-items:center;gap:14px;font-weight:600}
.busy .spin{width:42px;height:42px;border-width:4px}
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.18);padding:26px;width:min(440px,92%);text-align:center}
.rcard .ok{width:58px;height:58px;border-radius:50%;background:#2f9e5b;color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-size:30px;animation:pop .35s ease-out}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.rcard h3{margin:0 0 4px;font-size:18px}
.rcard .rthumb{height:170px;margin:14px auto;display:grid;place-items:center}
.rcard .rthumb img{max-height:170px;max-width:100%;border-radius:6px;box-shadow:var(--shadow);background:#fff}
.rcard .where{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13px;text-align:left;margin:10px 0 4px;word-break:break-word}
.rcard .where small{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.rcard .actions{justify-content:center}
.dest select{width:100%;margin-top:4px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.dest label{font-size:12px;color:var(--muted);font-weight:600;display:block}
.dest .path{font-size:12px;color:var(--muted);margin-top:5px;word-break:break-word}
/* browse */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:0 0 16px;font-size:13px}
.crumbs button{all:unset;cursor:pointer;padding:3px 8px;border-radius:6px;color:var(--muted)}
.crumbs button:hover{background:var(--hover);color:var(--text)}
.crumbs button:last-child{color:var(--text);font-weight:600}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:22px}
.ftile{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;min-width:0}
.ftile:hover{background:var(--hover)}
.ftile svg{width:28px;height:28px;flex:none;color:var(--accent)}
.ftile div{min-width:0}
.ftile b{display:block;font-weight:550;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftile small{color:var(--muted);font-size:12px}
.linkbox{margin-top:16px;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.linkbox h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin:0 0 6px}
.linkbox button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;width:100%;padding:4px 0;box-sizing:border-box}
.linkbox button:hover span:first-child{text-decoration:underline}
.linkbox span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkbox span:last-child{color:var(--muted);flex:none}
@media (max-width:900px){
  .mbody{grid-template-columns:1fr}
  .mside{border-left:0;border-top:1px solid var(--line)}
  .big{display:none}
}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .prev.open{position:fixed;inset:0;width:100%;z-index:10}
  .prev-in{width:100%}
  .row{grid-template-columns:34px 1fr 90px}
  .row .c.hide-s{display:none}
}

/* ===== Soft theme: floating white panels on a lavender background ===== */
.app{padding:14px}
.side{border:0;border-radius:22px;box-shadow:var(--shadow);margin-right:14px;padding:20px 14px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#a594ff,#7b68ee);box-shadow:0 6px 14px -6px rgba(123,104,238,.7)}
.nav-h{font-weight:700;letter-spacing:.08em}
.nav button{padding:8px 12px;border-radius:12px;font-weight:600;margin:1px 0;transition:background .15s,color .15s}
.nav button svg{color:var(--muted)}
.nav button.on{background:var(--accent-grad);color:#fff;box-shadow:var(--accent-glow)}
.nav button.on svg,.nav button.on .n{color:#fff}
.main{background:none}
.top{background:none;border:0;padding:4px 10px 12px}
.search{background:var(--panel);border:0;border-radius:14px;box-shadow:var(--shadow);max-width:600px}
.search input{padding:11px 0}
.search:focus-within{box-shadow:var(--shadow),0 0 0 2px var(--accent)}
.ctl,.seg{border:0;border-radius:12px;box-shadow:var(--shadow)}
.ctl{background:var(--panel);padding:9px 11px}
.seg button{background:var(--panel);padding:9px 11px}
.seg button.on{background:var(--accent-soft);color:var(--accent)}
select.ctl{font-weight:600}
.phead{background:none;border:0;padding:6px 10px 0}
.title h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.content{padding:6px 10px 24px}
.status{background:none;border:0;padding:6px 12px 0;min-height:24px}
/* type filters */
.chip{border:0;background:var(--panel);box-shadow:var(--shadow);font-weight:600;padding:6px 14px}
.chip:hover{color:var(--accent)}
.chip.on{background:var(--accent-grad);color:#fff;box-shadow:var(--accent-glow)}
/* cards */
.section-h{font-weight:700;font-size:15px}
.family{border:0;border-radius:22px;box-shadow:var(--shadow)}
.family .card{background:var(--panel2);box-shadow:none}
.card{border:0;border-radius:18px;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.card.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow-lg)}
.thumb{margin:8px 8px 0;border:0;border-radius:13px;background:var(--panel2);height:112px}
.thumb .badge{top:16px;left:16px}
.pages{top:96px;right:16px;border-radius:8px}
.badge{border-radius:7px;background-image:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,0))}
.name{font-weight:700}
.pin{border-radius:10px;top:14px;right:14px}
/* list */
.list{border:0;border-radius:18px;box-shadow:var(--shadow)}
.row{border-bottom-color:var(--panel2)}
.row .ic{width:32px;height:32px;border-radius:10px;background-image:linear-gradient(135deg,rgba(255,255,255,.32),rgba(255,255,255,0));box-shadow:0 4px 10px -5px color-mix(in srgb,var(--tint) 35%,transparent)}
.row .nm div{font-weight:600}
.row.sel{background:var(--accent-soft)}
.row.hd{background:var(--panel);top:-6px}
.row.hd:hover{background:var(--panel)}
/* folders */
.folders{gap:12px}
.ftile{border:0;border-radius:16px;box-shadow:var(--shadow);padding:12px;transition:transform .15s,box-shadow .15s}
.ftile:hover{background:var(--panel);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.ftile svg{width:40px;height:40px;padding:9px;border-radius:12px;background:var(--violet-soft);color:var(--violet);fill:color-mix(in srgb,var(--violet) 22%,transparent)}
.ftile b{font-weight:700}
.crumbs button{border-radius:9px;font-weight:600}
/* preview panel */
.prev{border:0;border-radius:22px;box-shadow:var(--shadow);transition:width .2s,margin .2s}
.prev.open{margin-left:14px}
.prev-top{border-bottom-color:var(--panel2)}
.stage{background:var(--panel2);border:0;margin:0 12px;border-radius:16px}
.pager{border:0}
.pager button{border:0;border-radius:9px;background:var(--panel2)}
.pbody h2{font-weight:800}
.btn{border:0;border-radius:12px;background:var(--panel2);font-weight:700;padding:8px 14px}
.btn.primary{background:var(--accent-grad);box-shadow:var(--accent-glow)}
.rel button,.linkbox{border-radius:12px}
.rel .ic{border-radius:7px}
/* windows */
.mbox{border:0;border-radius:24px}
.pages-grid{background:var(--bg)}
.pg .im{border-radius:8px}
.pg.in{background:var(--accent-soft)}
.range input,.dest select{border:0;border-radius:12px;background:var(--panel2)}
.rcard{border:0;border-radius:24px}
.toast{border-radius:14px;font-weight:600}
.empty b{font-weight:800}
/* slim scrollbars */
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--muted) 45%,transparent) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--muted) 40%,transparent);border-radius:10px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
@media (max-width:900px){ .app{padding:0} .prev.open{margin:0;border-radius:0} }

/* ===== Appearance panel ===== */
.appear{position:fixed;top:66px;right:22px;z-index:30;width:330px;max-height:calc(100vh - 90px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:16px 18px 18px;display:none}
.appear.on{display:block;animation:popin .14s ease-out}
@keyframes popin{from{opacity:0;transform:translateY(-6px)}}
.appear h3{margin:0 0 2px;font-size:16px;font-weight:800}
.appear .ah{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 8px}
.appear .opts{display:flex;gap:6px;background:var(--panel2);border-radius:12px;padding:4px}
.appear .opts button{flex:1;border:0;background:none;border-radius:9px;padding:7px 6px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.appear .opts button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sw{border:2px solid transparent;border-radius:13px;padding:6px;cursor:pointer;background:var(--panel2);text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.sw.on{border-color:var(--accent);color:var(--text)}
.sw i{display:block;height:34px;border-radius:9px;margin-bottom:5px;position:relative;overflow:hidden}
.sw i::after{content:"";position:absolute;left:8px;right:24px;top:9px;bottom:9px;border-radius:5px;background:#fff;opacity:.9}
.dots{display:flex;flex-wrap:wrap;gap:10px}
.dot{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;color:#fff;box-shadow:0 3px 8px -3px rgba(0,0,0,.35)}
.dot.on{outline:2px solid var(--accent);outline-offset:3px}
.dot svg{width:15px;height:15px;opacity:0}
.dot.on svg{opacity:1}
.appear .reset{margin-top:16px;width:100%}

/* ===== Style: Flat (clean lines, like Finder) ===== */
:root[data-style="flat"] :is(.side,.prev,.card,.list,.ftile,.family,.search,.ctl,.seg,.chip,.mbox,.rcard){box-shadow:none;border:1px solid var(--line)}
:root[data-style="flat"] :is(.side,.prev){border-radius:14px}
:root[data-style="flat"] :is(.card,.list,.family,.ftile){border-radius:10px}
:root[data-style="flat"] .thumb{border-radius:7px}
:root[data-style="flat"] :is(.nav button,.btn,.ctl,.seg,.search){border-radius:8px}
:root[data-style="flat"] :is(.nav button.on,.chip.on,.btn.primary){background:var(--accent);box-shadow:none}
:root[data-style="flat"] .card:hover,:root[data-style="flat"] .ftile:hover{transform:none;box-shadow:none;border-color:var(--accent)}
:root[data-style="flat"] .card.sel{box-shadow:0 0 0 1px var(--accent);border-color:var(--accent)}
:root[data-style="flat"] .row .ic,:root[data-style="flat"] .badge{background-image:none;box-shadow:none}

/* ===== Style: Glass (see-through panels on a colourful background) ===== */
:root[data-style="glass"] body{background:
  radial-gradient(900px 600px at 0% 0%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 65%),
  radial-gradient(900px 700px at 100% 100%,hsl(var(--h) 75% 65% / .38),transparent 65%),
  radial-gradient(700px 500px at 60% 30%,hsl(calc(var(--h) + 60) 70% 70% / .18),transparent 70%),var(--bg)}
:root[data-style="glass"]{--glass:color-mix(in srgb,var(--panel) 58%,transparent);--glass-line:color-mix(in srgb,#fff 55%,transparent)}
:root[data-theme="dark"][data-style="glass"]{--glass-line:color-mix(in srgb,#fff 9%,transparent)}
@media (prefers-color-scheme:dark){:root[data-style="glass"]:not([data-theme="light"]){--glass-line:color-mix(in srgb,#fff 9%,transparent)}}
:root[data-style="glass"] :is(.side,.prev,.search,.ctl,.seg button:not(.on),.chip:not(.on),.card,.list,.ftile,.family){background:var(--glass);border:1px solid var(--glass-line)}
:root[data-style="glass"] :is(.side,.prev,.search){backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5)}
:root[data-style="glass"] .seg{background:none}
:root[data-style="glass"] :is(.thumb,.stage,.family .card){background:color-mix(in srgb,var(--panel2) 55%,transparent)}
:root[data-style="glass"] .row.hd{background:color-mix(in srgb,var(--panel) 92%,transparent)}
:root[data-style="glass"] .row{border-bottom-color:var(--glass-line)}

/* ===== Density: Compact ===== */
:root[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:10px}
:root[data-density="compact"] .thumb{height:84px}
:root[data-density="compact"] .pages{top:68px}
:root[data-density="compact"] .meta{padding:7px 9px 9px}
:root[data-density="compact"] .name{font-size:12.5px}
:root[data-density="compact"] .row{padding:5px 14px}
:root[data-density="compact"] .row .ic{width:26px;height:26px;font-size:8.5px}
:root[data-density="compact"] .nav button{padding:6px 12px}
:root[data-density="compact"] .section{margin-bottom:18px}
:root[data-density="compact"] .ftile{padding:8px 10px}
:root[data-density="compact"] .ftile svg{width:32px;height:32px;padding:7px}
:root[data-density="compact"] .title h1{font-size:22px}

/* ===== Font ===== */
:root[data-font="system"] body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
:root[data-font="serif"] body{font-family:"New York",ui-serif,Georgia,"Times New Roman",serif}
@media (max-width:900px){ .appear{right:8px;left:8px;width:auto} }

/* ===== Rename box ===== */
.rn{position:fixed;inset:0;z-index:70;background:rgba(10,14,22,.35);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;padding-top:16vh}
.rn.on{display:flex}
.rn .box{width:min(440px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:18px;animation:popin .14s ease-out}
.rn h3{margin:0 0 4px;font-size:16px;font-weight:800}
.rn p{margin:0 0 12px;color:var(--muted);font-size:12.5px;word-break:break-word}
.rn input{width:100%;padding:10px 12px;border:2px solid var(--accent);border-radius:11px;background:var(--panel2);font-size:15px;font-weight:600;outline:none}
.rn .err{color:#e5484d;font-size:12.5px;min-height:18px;margin:8px 0 0}
.rn .actions{justify-content:flex-end;margin:10px 0 0}
/* ===== Right-click menu ===== */
.ctx{position:fixed;z-index:60;min-width:236px;max-width:300px;background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg),0 0 0 .5px rgba(0,0,0,.04);padding:6px;font-size:13px;display:none;user-select:none}
.ctx.on{display:block;animation:ctxin .1s ease-out}
@keyframes ctxin{from{opacity:0;transform:scale(.97)}}
.ctx .ch{display:flex;align-items:center;gap:10px;padding:8px 10px 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.ctx .ch .ic{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;font-size:8.5px;font-weight:800;text-transform:uppercase;background-image:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,0))}
.ctx .ch .ic svg{width:16px;height:16px}
.ctx .ch b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.ctx .ch small{color:var(--muted);font-size:11.5px}
.ctx .ci{position:relative;display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:6px 10px;border-radius:8px;cursor:pointer;color:var(--text);white-space:nowrap}
.ctx .ci svg{width:16px;height:16px;flex:none;color:var(--muted)}
.ctx .ci .k{margin-left:auto;padding-left:18px;color:var(--muted);font-size:12px;letter-spacing:.04em}
.ctx .ci .lbl{overflow:hidden;text-overflow:ellipsis}
.ctx .ci:hover,.ctx .ci.open{background:var(--accent);color:#fff}
.ctx .ci:hover svg,.ctx .ci:hover .k,.ctx .ci.open svg,.ctx .ci.open .k{color:#fff}
.ctx .ci.dis{opacity:.42;pointer-events:none}
.ctx .ci .chk{width:16px;flex:none;text-align:center}
.ctx .sep{height:1px;background:var(--line);margin:5px 8px}
.ctx .sub{position:absolute;left:calc(100% + 2px);top:-7px;display:none}
.ctx .sub.left{left:auto;right:calc(100% + 2px)}
.ctx .ci.open>.sub{display:block}
.ctx .sub{min-width:190px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></div>FileHub</div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <main class="main">
    <div class="top">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="Search names and text inside files…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <select class="ctl" id="sort" title="Sort">
        <option value="recent">Last opened</option>
        <option value="modified">Last changed</option>
        <option value="added">Newest first</option>
        <option value="used">Most used</option>
        <option value="name">Name A–Z</option>
        <option value="size">Biggest</option>
      </select>
      <div class="seg" id="viewSeg">
        <button data-v="grid" title="Grid"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
        <button data-v="list" title="List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
      </div>
      <button class="ctl" id="refresh" title="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="ctl" id="appearBtn" title="Appearance: themes, accent colour and style"></button>
      <button class="ctl" id="theme" title="Light / dark"></button>
    </div>
    <div class="phead" id="phead"></div>
    <div class="content" id="content"></div>
    <div class="status" id="status"></div>
  </main>

  <aside class="prev" id="prev"><div class="prev-in" id="prevIn"></div></aside>
</div>
<div class="appear" id="appear"></div>
<div class="ctx" id="ctx"></div>
<div class="rn" id="rn"><div class="box"><h3>Rename</h3><p id="rnWhere"></p>
  <input id="rnInput" spellcheck="false" autocomplete="off"><div class="err" id="rnErr"></div>
  <div class="actions"><button class="btn" id="rnCancel">Cancel</button><button class="btn primary" id="rnSave">Rename</button></div></div></div>
<div class="toast" id="toast"></div>
<div class="zoom" id="zoom">
  <div class="zbar">
    <b id="zLabel"></b><span class="sp"></span>
    <span id="zRangeBtns"><button class="btn" id="zFrom">Start split here</button> <button class="btn" id="zTo">End split here</button></span>
    <button class="btn" id="zOut" title="Zoom out (−)">−</button><button class="btn" id="zIn" title="Zoom in (+)">+</button>
    <button class="btn primary" id="zClose">Close</button>
  </div>
  <button class="znav l" id="zPrev" title="Previous page (←)">‹</button>
  <div class="zstage" id="zStage"><img id="zImg" alt=""></div>
  <button class="znav r" id="zNext" title="Next page (→)">›</button>
</div>
<div class="modal" id="splitModal">
  <div class="mbox">
    <div class="mhead"><h2>Split PDF</h2><span class="fn" id="spName"></span>
      <div class="tsize">Page size <div class="seg" id="spSize"><button data-t="130px">S</button><button data-t="190px">M</button><button data-t="280px">L</button></div></div>
      <button class="x" id="spClose" title="Close (Esc)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="mbody">
      <div class="pages-grid" id="spGrid"></div>
      <div class="mside">
        <div class="big" id="spBig"></div>
        <div class="range">
          <label>From page<input type="number" id="spFrom" min="1" value="1"></label>
          <label>To page<input type="number" id="spTo" min="1" value="1"></label>
        </div>
        <p class="hint">Click a page to start, then click another page to end. Shift‑click also sets the end.</p>
        <div class="quick" id="spQuick"></div>
        <div class="summary" id="spSum"></div>
        <div class="dest"><label>Save to
          <select id="spDest"></select></label>
          <div class="path" id="spDestPath"></div></div>
        <button class="btn primary" id="spSave">Save as new PDF</button>
        <p class="hint">Your original file is not changed. The new PDF is saved in the same folder.</p>
      </div>
    </div>
    <div class="busy" id="spBusy"><div class="bx"><div class="spin"></div><span id="spBusyText">Saving…</span></div></div>
    <div class="mresult" id="spResult"></div>
  </div>
</div>

<script>
const ICONS = {
  open:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  recent:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

  pinned:'<path d="M12 17v5M9 3h6l-1 6 4 4H6l4-4z"/>',
  families:'<rect x="3" y="4" width="13" height="16" rx="2"/><path d="M8 2h11a2 2 0 0 1 2 2v14"/>',
  sources:'<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
  folders:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  types:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',

const svg = (k, fill) => `<svg viewBox="0 0 24 24" fill="${fill||'none'}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[k]}</svg>`;
const VIEWS = [
  {id:'open',label:'Open now',icon:'open',h:'Main'},
  {id:'recent',label:'Recent',icon:'recent'},
  {id:'used',label:'Most used',icon:'used'},
  {id:'pinned',label:'Pinned',icon:'pinned'},
  {id:'families',label:'Related files',icon:'families',h:'Organise by'},
  {id:'sources',label:'Where it came from',icon:'sources'},
  {id:'folders',label:'Folders',icon:'folders'},
  {id:'types',label:'File types',icon:'types'},
];
const TYPE_COLOR = {PDF:'--pdf',Word:'--word',Slides:'--slides',Sheets:'--sheets',Images:'--img',Video:'--video',Audio:'--audio',Archives:'--other',Other:'--other'};
const color = t => `var(${TYPE_COLOR[t]||'--other'})`;

const store = {
  get(k, d){ try{ const v = localStorage.getItem('filehub.'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('filehub.'+k, JSON.stringify(v)); }catch(e){} },
};
const S = {
  view: store.get('view','recent'), layout: store.get('layout','grid'), sort: store.get('sort','recent'),
  pins: new Set(store.get('pins',[])), files: [], open: [], places: [], browse: store.get('browse', null), browseData: null, results: null, q:'', sel:null, typeFilter:'All',
};
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- formatting ----------
function ago(t){
  if(!t) return '—';
  const s = Date.now()/1000 - t;
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60)+' min ago';
  if(s < 86400) return Math.floor(s/3600)+' h ago';
  if(s < 86400*2) return 'yesterday';
  if(s < 86400*7) return Math.floor(s/86400)+' days ago';
  return new Date(t*1000).toLocaleDateString(undefined,{day:'numeric',month:'short',year: s>86400*300?'numeric':undefined});
}
function size(b){ if(b<1024) return b+' B'; const u=['KB','MB','GB']; let i=-1; do{b/=1024;i++;}while(b>=1024&&i<2); return b.toFixed(b<10?1:0)+' '+u[i]; }
const lastTouch = f => f.lastUsed || f.modified;
const pagesText = f => f.pages ? `${f.pages} ${f.pages===1 ? f.pageWord.replace(/s$/,'') : f.pageWord}` : '';

// ---------- data ----------
async function api(path){ const r = await fetch(path); if(!r.ok) throw new Error(await r.text()); return r.json(); }
async function post(path, body){ return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); }

async function load(refresh){
  $('content').innerHTML = '<div class="loading"><div class="spin"></div>Reading your files…</div>';
  try{
    const [files, open] = await Promise.all([api('/api/library'+(refresh?'?refresh=1':'')), api('/api/open')]);
    S.files = files; S.open = open;
  }catch(e){
    $('content').innerHTML = `<div class="empty"><b>Couldn't read your files</b>${esc(e.message)}</div>`;
    return;
  }
  if(S.view==='browse' && S.browse && !S.browseData) return openFolder(S.browse);
  render();
}

function byPath(){ const m = new Map(); [...S.files, ...S.open, ...(S.results||[]), ...((S.browseData&&S.browseData.files)||[])].forEach(f => m.set(f.path, f)); return m; }

function sorted(list){
  const k = S.sort, a = [...list];
  const fns = {
    recent:(x,y)=>lastTouch(y)-lastTouch(x), modified:(x,y)=>y.modified-x.modified,
    added:(x,y)=>y.created-x.created, used:(x,y)=>(y.useCount-x.useCount)||(lastTouch(y)-lastTouch(x)),
    name:(x,y)=>x.name.localeCompare(y.name,undefined,{numeric:true}), size:(x,y)=>y.size-x.size,
  };
  return a.sort(fns[k]);
}

function groupBy(list, keyFn){
  const m = new Map();
  for(const f of list){ const k = keyFn(f); if(!k) continue; if(!m.has(k)) m.set(k, []); m.get(k).push(f); }
  return m;
}

// ---------- rendering ----------
function renderNav(){
  const counts = {
    open: openNow().length, recent: S.files.length, pinned: S.pins.size,
    families: families().length,
  };
  let html = '';
  for(const v of VIEWS){
    if(v.h) html += `<div class="nav-h">${v.h}</div>`;
    const n = counts[v.id];
    html += `<button class="${S.view===v.id&&!S.q?'on':''}" data-view="${v.id}">${svg(v.icon)}${v.label}${n!=null?`<span class="n">${n}</span>`:''}</button>`;
  }
  if(S.places.length){
    html += `<div class="nav-h">Places</div>`;
    for(const p of S.places){
      const on = S.view==='browse' && !S.q && S.browse && (S.browse===p.path || (p.icon!=='home' && S.browse.startsWith(p.path+'/')));
      html += `<button class="${on?'on':''}" data-place="${esc(p.path)}">${svg(ICONS[p.icon]?p.icon:'folder')}${esc(p.name)}</button>`;
    }
  }
  $('nav').innerHTML = html;
}

function openNow(){
  // Files held open by apps, plus anything opened in the last 3 hours.
  const m = new Map(S.open.map(f => [f.path, f]));
  const cut = Date.now()/1000 - 3*3600;
  S.files.filter(f => f.lastUsed && f.lastUsed > cut).forEach(f => { if(!m.has(f.path)) m.set(f.path, f); });
  return [...m.values()];
}

function families(){
  const g = groupBy(S.files, f => f.family);
  return [...g.entries()].filter(([k, v]) => v.length > 1)
    .map(([k, v]) => ({key:k, files: v.sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))}))
    .sort((a,b) => Math.max(...b.files.map(lastTouch)) - Math.max(...a.files.map(lastTouch)));
}

function card(f){
  const pinned = S.pins.has(f.path);
  const info = S.sort==='used' ? `Opened ${f.useCount}× · ${ago(lastTouch(f))}` : `${ago(lastTouch(f))} · ${size(f.size)}`;
  return `<div class="card ${S.sel===f.path?'sel':''}" data-path="${esc(f.path)}" title="${esc(f.folder)}">
    <div class="thumb"><span class="badge" style="background:${color(f.type)}">${esc(f.ext||'file')}</span>
      <img loading="lazy" data-src="/api/thumb?s=240&path=${encodeURIComponent(f.path)}" alt="">
      ${f.pages?`<span class="pages">${pagesText(f)}</span>`:''}</div>
    <button class="pin ${pinned?'on':''}" data-pin="${esc(f.path)}" title="${pinned?'Unpin':'Pin'}">${svg('star', pinned?'currentColor':'none')}</button>
    <div class="meta" title="${esc(f.name)}"><div class="name">${esc(f.name)}</div><div class="info">${esc(info)}</div></div></div>`;
}
function row(f){
  return `<div class="row ${S.sel===f.path?'sel':''}" data-path="${esc(f.path)}">
    <div class="ic" style="background:${color(f.type)}">${esc((f.ext||'?').slice(0,4))}</div>
    <div class="nm"><div>${S.pins.has(f.path)?'★ ':''}${esc(f.name)}</div><small>${f.pages?pagesText(f)+' · ':''}${esc(f.folder)}</small></div>
    <div class="c hide-s">${esc(f.source)}</div>
    <div class="c">${ago(lastTouch(f))}</div>
    <div class="c hide-s">${f.useCount?f.useCount+'×':''}</div></div>`;
}
const LIST_HEAD = `<div class="row hd"><div></div><div>Name</div><div class="c hide-s">Came from</div><div class="c">Last used</div><div class="c hide-s">Opened</div></div>`;
const block = list => S.layout==='grid' ? `<div class="grid">${list.map(card).join('')}</div>` : `<div class="list">${LIST_HEAD}${list.map(row).join('')}</div>`;

// Status bar: how many items are shown, and which file is selected.
function renderStatus(){
  const c = $('content');
  const files = new Set([...c.querySelectorAll('.card[data-path],.row[data-path]')].map(e => e.dataset.path)).size;
  const folders = c.querySelectorAll('.ftile').length;
  const parts = [];
  if(folders) parts.push(`${folders} folder${folders===1?'':'s'}`);
  parts.push(`${files} file${files===1?'':'s'}`);
  const f = S.sel && byPath().get(S.sel);
  $('status').innerHTML = `<span>${parts.join(' · ')}</span>${f?`<span class="sel-name" title="${esc(f.path)}">${esc(f.name)}${f.size?' · '+size(f.size):''}</span>`:''}`;
}

function sections(groups, opts={}){
  if(!groups.length) return empty('Nothing here yet', opts.emptyMsg||'');
  return groups.map(g => `<div class="section ${opts.boxed?'family':''}">
    <div class="section-h">${opts.dot?`<span class="badge" style="background:${color(g.key)}">${esc(g.key)}</span>`:esc(opts.label?opts.label(g):g.key)}
      <span class="count">${g.files.length} file${g.files.length>1?'s':''}</span>
      ${opts.folderLink && g.files[0] ? `<span class="folder" data-reveal="${esc(g.files[0].path)}">${esc(commonFolder(g.files))} ↗</span>`:''}</div>
    ${block(opts.noSort?g.files:sorted(g.files).slice(0, opts.max||200))}</div>`).join('');
}
function commonFolder(files){ const fs = [...new Set(files.map(f=>f.folder))]; return fs.length===1 ? fs[0] : fs.length+' folders'; }
function titleCase(s){ return s.replace(/\b\w/g, c => c.toUpperCase()); }
const empty = (t, m) => `<div class="empty"><b>${esc(t)}</b>${esc(m)}</div>`;

function typeChips(list){
  const types = ['All', ...new Set(list.map(f => f.type))];
  return `<div class="chips">${types.map(t=>`<button class="chip ${S.typeFilter===t?'on':''}" data-type="${t}">${t}</button>`).join('')}</div>`;
}
const filt = list => S.typeFilter==='All' ? list : list.filter(f => f.type===S.typeFilter);

function render(){
  renderNav();
  let title, sub, body, tools = '';
  if(S.q){
    title = `Results for “${S.q}”`;
    if(!S.results){ body = '<div class="loading"><div class="spin"></div>Searching…</div>'; sub=''; }
    else { const r = filt(S.results); sub = `${r.length} files found across your Mac`; tools = typeChips(S.results); body = (r.length?block(sorted(r)):empty('No files found','Try a shorter word, or part of the name.')); }
  } else switch(S.view){
    case 'open': {
      const l = openNow();
      title='Open now'; sub='Files open in your apps, and files you opened in the last 3 hours.';
      body = l.length ? block(sorted(l)) : empty('No open files','Files you open will show up here.');
      break; }
    case 'recent': {
      title='Recent'; sub='Everything you opened, changed or downloaded in the last 60 days.';
      const l = filt(S.files);
      const now = Date.now()/1000, day = 86400;
      const buckets = [['Today',day],['This week',7*day],['This month',31*day],['Earlier',1e12]];
      const groups = []; let prev = 0;
      for(const [k, lim] of buckets){ const fs = l.filter(f => { const a = now-lastTouch(f); return a>=prev && a<lim; }); if(fs.length) groups.push({key:k, files:fs}); prev = lim; }
      tools = typeChips(S.files); body = (S.sort==='recent' ? sections(groups, {max:120}) : block(sorted(l).slice(0,400)));
      break; }
    case 'used': {
      title='Most used'; sub='The files you come back to the most.';
      const l = filt(S.files).filter(f => f.useCount > 1).sort((a,b)=>(b.useCount-a.useCount)||(lastTouch(b)-lastTouch(a))).slice(0,120);
      tools = typeChips(S.files); body = (l.length?block(l):empty('Nothing yet','Open some files a few times and they will appear here.'));
      break; }
    case 'pinned': {
      const m = byPath(); const l = [...S.pins].map(p => m.get(p)).filter(Boolean);
      title='Pinned'; sub='Your important files, always one click away. Hover a file and press ☆ to pin it.';
      body = l.length ? block(sorted(l)) : empty('No pinned files yet','Hover any file and press the star.');
      break; }
    case 'families': {
      const fams = families().filter(g => S.typeFilter==='All' || g.files.some(f=>f.type===S.typeFilter));
      title='Related files'; sub='Files that belong together: the original lesson, its split parts, copies, marked and answer versions.';
      tools = typeChips(S.files); body = sections(fams.slice(0,80), {boxed:true, noSort:true, folderLink:true, label:g=>titleCase(g.key)});
      break; }
    case 'sources': {
      const g = groupBy(filt(S.files), f => f.source);
      const groups = [...g.entries()].map(([key,files])=>({key,files})).sort((a,b)=>b.files.length-a.files.length);
      title='Where it came from'; sub='Grouped by the website you downloaded it from, or the folder it lives in.';
      tools = typeChips(S.files); body = sections(groups, {max:24});
      break; }
    case 'folders': {
      const g = groupBy(filt(S.files), f => f.folder);
      const groups = [...g.entries()].map(([key,files])=>({key,files})).sort((a,b)=>Math.max(...b.files.map(lastTouch))-Math.max(...a.files.map(lastTouch)));
      title='Folders'; sub='Your busiest folders, most recently used first.';
      tools = typeChips(S.files); body = sections(groups.slice(0,40), {max:24, folderLink:true});
      break; }
    case 'browse': {
      const d = S.browseData;
      if(!d){ title='Loading…'; sub=''; body='<div class="loading"><div class="spin"></div>Opening folder…</div>'; break; }
      title = d.crumbs.length ? d.crumbs[d.crumbs.length-1].name : d.display; sub = d.display;
      const crumbs = `<div class="crumbs">${d.crumbs.map((c,i)=>`${i?'<span style="color:var(--muted)">›</span>':''}<button data-browse="${esc(c.path)}">${esc(c.name)}</button>`).join('')}
        <button data-reveal-folder="${esc(d.path)}" style="margin-left:auto;color:var(--accent)">Open in Finder ↗</button></div>`;
      const folders = d.folders.length ? `<div class="section-h">Folders <span class="count">${d.folders.length}</span></div><div class="folders">${d.folders.map(f=>`<div class="ftile" data-browse="${esc(f.path)}">${svg('folder')}<div><b>${esc(f.name)}</b><small>${f.count} item${f.count===1?'':'s'}</small></div></div>`).join('')}</div>` : '';
      const fl = filt(d.files);
      const files = d.files.length ? `<div class="section-h">Files <span class="count">${d.files.length}</span></div>${fl.length?block(sorted(fl)):empty('No files of this type','')}` : '';
      tools = crumbs + (d.files.length ? typeChips(d.files) : '');
      body = folders + files + (!d.folders.length && !d.files.length ? empty('This folder is empty','') : '');
      break; }
    case 'types': {
      const g = groupBy(S.files, f => f.type);
      const groups = [...g.entries()].map(([key,files])=>({key,files})).sort((a,b)=>b.files.length-a.files.length);
      title='File types'; sub='PDFs, slides, sheets, images and more.';
      body = sections(groups, {dot:true, max:24});
      break; }
  }
  $('phead').innerHTML = `<div class="title"><h1>${esc(title)}</h1></div><p class="sub">${esc(sub)}</p>${tools}`;
  $('content').innerHTML = body;
  loadThumbs();
  renderStatus();
}

// Thumbnails load as they scroll into view.
const io = new IntersectionObserver(es => es.forEach(e => {
  if(!e.isIntersecting) return; const img = e.target; io.unobserve(img);
  img.onload = () => img.classList.add('ok'); img.onerror = () => img.remove(); img.src = img.dataset.src;
}), {rootMargin:'300px'});
function loadThumbs(){ document.querySelectorAll('img[data-src]').forEach(i => io.observe(i)); }

// ---------- preview ----------
function preview(f){
  S.sel = f.path;
  document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel'));
  document.querySelectorAll(`[data-path="${CSS.escape(f.path)}"]`).forEach(e=>e.classList.add('sel'));
  renderStatus();
  const raw = '/api/raw?path='+encodeURIComponent(f.path);
  let stage;
  if(f.ext==='pdf') stage = `<img src="${pageImg(1, true, f)}" alt="" onerror="this.src='/api/thumb?s=720&path=${encodeURIComponent(f.path)}'">`;
  else if(['png','jpg','jpeg','gif','webp','svg'].includes(f.ext)) stage = `<img src="${raw}">`;
  else if(['mp4','m4v','mov'].includes(f.ext) && f.size < 300e6) stage = `<video src="${raw}" controls></video>`;
  else stage = `<img src="/api/thumb?s=720&path=${encodeURIComponent(f.path)}" onerror="this.outerHTML='<span style=\\'color:var(--muted)\\'>No preview — press Quick Look</span>'">`;
  const rel = f.family ? S.files.filter(x => x.family===f.family && x.path!==f.path) : [];
  const sameFolder = S.files.filter(x => x.folder===f.folder && x.path!==f.path && !rel.includes(x)).sort((a,b)=>lastTouch(b)-lastTouch(a)).slice(0,6);
  const relList = (h, l) => l.length ? `<div class="rel"><h3>${h}</h3>${l.map(x=>`<button data-path="${esc(x.path)}"><span class="ic" style="background:${color(x.type)}">${esc(x.ext.slice(0,3))}</span><span>${esc(x.name)}</span></button>`).join('')}</div>` : '';
  const pinned = S.pins.has(f.path);
  $('prevIn').innerHTML = `
    <div class="prev-top"><b>Preview</b><button class="x" id="closePrev" title="Close (Esc)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    ${f.ext==='pdf' && f.pages>1 ? `<div class="pager"><button id="pgPrev" disabled>‹</button><span id="pgLbl">Page 1 of ${f.pages}</span><button id="pgNext">›</button></div>` : ''}<div class="stage ${f.ext==='pdf'?'pdf':''}" id="pStage">${stage}</div>
    <div class="pbody">
      <h2>${esc(f.name)}</h2>
      <div class="info">${esc(f.kind || f.type)} · ${f.pages?pagesText(f)+' · ':''}${size(f.size)}</div>
      <div class="actions">
        <button class="btn primary" data-act="launch">Open</button>
        <button class="btn" data-act="reveal">Show in Finder</button>
        <button class="btn" data-act="quicklook" title="Space">Quick Look</button>
        ${f.ext==='pdf'?`<button class="btn" data-act="read">Read here</button><button class="btn" data-act="split">✂︎ Split pages</button>`:''}
        <button class="btn" data-act="pin">${pinned?'★ Pinned':'☆ Pin'}</button>
        <button class="btn" data-act="copy">Copy path</button>
      </div>
      <dl>
        <dt>Last opened</dt><dd>${f.lastUsed?ago(f.lastUsed):'Not recorded'}</dd>
        <dt>Times opened</dt><dd>${f.useCount||'—'}</dd>
        <dt>Changed</dt><dd>${ago(f.modified)}</dd>
        <dt>Created</dt><dd>${ago(f.created)}</dd>
        <dt>Came from</dt><dd>${f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.source)}</a>`:esc(f.source)}</dd>
        <dt>Folder</dt><dd>${esc(f.folder)}</dd>
        ${f.app?`<dt>Open in</dt><dd>${esc(f.app)}</dd>`:''}
      </dl>
      ${splitLinks(f)}
      ${relList('Belongs with ('+rel.length+')', rel.slice(0,15))}
      ${relList('Same folder', sameFolder)}
    </div>`;
  $('prev').classList.add('open');
  if(f.ext==='pdf'){
    let cur = 1; const n = f.pages || 1;
    const go = d => { cur = Math.max(1, Math.min(n, cur+d)); const im = $('pStage').querySelector('img'); if(im) im.src = pageImg(cur, true, f);
      if($('pgLbl')){ $('pgLbl').textContent = `Page ${cur} of ${n}`; $('pgPrev').disabled = cur<=1; $('pgNext').disabled = cur>=n; } };
    if($('pgPrev')){ $('pgPrev').onclick = () => go(-1); $('pgNext').onclick = () => go(1); }
    $('pStage').onclick = () => openZoom(cur, f, n, false);
  }
}
function splitLinks(f){
  let h = '';
  if(f.splitFrom){
    const r = f.splitFrom.from===f.splitFrom.to ? `page ${f.splitFrom.from}` : `pages ${f.splitFrom.from}–${f.splitFrom.to}`;
    h += `<div class="linkbox"><h3>✂︎ Split from</h3><button data-goto="${esc(f.splitFrom.path)}"><span>${esc(f.splitFrom.name)}</span><span>${r}</span></button></div>`;
  }
  const kids = new Map((f.splitInto||[]).map(c => [c.path, c]));
  S.files.forEach(x => { if(x.splitFrom && x.splitFrom.path===f.path && !kids.has(x.path)) kids.set(x.path, {path:x.path, from:x.splitFrom.from, to:x.splitFrom.to}); });
  if(kids.size){
    const list = [...kids.values()].sort((a,b)=>a.from-b.from);
    h += `<div class="linkbox"><h3>✂︎ Split into ${list.length} file${list.length>1?'s':''}</h3>${list.map(c=>`<button data-goto="${esc(c.path)}"><span>${esc(c.path.split('/').pop())}</span><span>${c.from===c.to?'p. '+c.from:'pp. '+c.from+'–'+c.to}</span></button>`).join('')}</div>`;
  }
  return h;
}
async function goto(path){
  let f = byPath().get(path);
  if(!f){ try{ const folder = path.slice(0, path.lastIndexOf('/')); await openFolder(folder); f = byPath().get(path); }catch(e){} }
  if(f) preview(f); else toast('That file was moved or deleted');
}
async function openFolder(path){
  S.view='browse'; S.browse=path; S.q=''; $('q').value=''; S.typeFilter='All'; S.browseData=null; store.set('view','browse'); store.set('browse',path);
  render();
  try{ S.browseData = await api('/api/browse?path='+encodeURIComponent(path)); }
  catch(e){ S.browseData = {path, display:path, crumbs:[], folders:[], files:[]}; toast("Can't open that folder"); }
  if(S.browse===path) render();
  $('content').scrollTop = 0;
}
function closePreview(){ $('prev').classList.remove('open'); S.sel=null; document.querySelectorAll('.sel').forEach(e=>e.classList.remove('sel')); renderStatus(); }

function togglePin(p){
  S.pins.has(p) ? S.pins.delete(p) : S.pins.add(p);
  store.set('pins', [...S.pins]);
  toast(S.pins.has(p) ? 'Pinned' : 'Unpinned');
}
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }

// ---------- events ----------
document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-view]');
  if(nav){ S.view = nav.dataset.view; S.q=''; $('q').value=''; S.typeFilter='All'; store.set('view', S.view); render(); $('content').scrollTop=0; return; }
  const pl = e.target.closest('[data-place],[data-browse]');
  if(pl && !e.target.closest('.modal')){ openFolder(pl.dataset.place || pl.dataset.browse); return; }
  const rf = e.target.closest('[data-reveal-folder]');
  if(rf){ post('/api/launch',{path:rf.dataset.revealFolder}); return; }
  const gt = e.target.closest('[data-goto]');
  if(gt){ goto(gt.dataset.goto); return; }
  const pin = e.target.closest('[data-pin]');
  if(pin){ e.stopPropagation(); togglePin(pin.dataset.pin); render(); return; }
  const chip = e.target.closest('[data-type]');
  if(chip){ S.typeFilter = chip.dataset.type; render(); return; }
  const rv = e.target.closest('[data-reveal]');
  if(rv){ post('/api/reveal',{path:rv.dataset.reveal}); return; }
  const act = e.target.closest('[data-act]');
  if(act && S.sel){
    const a = act.dataset.act;
    if(a==='pin'){ togglePin(S.sel); preview(byPath().get(S.sel)); renderNav(); }
    else if(a==='split'){ openSplit(byPath().get(S.sel)); }
    else if(a==='read'){ document.querySelector('.stage').innerHTML = `<iframe src="/api/raw?path=${encodeURIComponent(S.sel)}#view=FitH"></iframe>`; }
    else if(a==='copy'){ navigator.clipboard.writeText(S.sel).then(()=>toast('Path copied')); }
    else { post('/api/'+a, {path:S.sel}); toast(a==='launch'?'Opening…':a==='reveal'?'Showing in Finder':'Quick Look'); }
    return;
  }
  if(e.target.closest('#closePrev')){ closePreview(); return; }
  const item = e.target.closest('[data-path]');
  if(item){ const f = byPath().get(item.dataset.path); if(f) preview(f); }
});

  {id:'rose',     name:'Rose',     h:340, sat:.75},

const ACCENTS = [
  {id:'orange', name:'Orange', c:'#ff7a4d', a:'#ff9466', b:'#ff6a3d'},

const LOOK_DEFAULT = {theme:'lavender', accent:'orange', style:'soft', density:'comfortable', font:'rounded'};
const look = () => Object.assign({}, LOOK_DEFAULT, store.get('look', {}));

function setLook(k, v){ const L = look(); L[k] = v; store.set('look', L); applyLook(); renderAppear(); }

    <div class="ah">Accent colour</div><div class="dots">${ACCENTS.map(a=>`<button class="dot ${L.accent===a.id?'on':''}" title="${a.name}" data-look="accent" data-v="${a.id}" style="background:linear-gradient(135deg,${a.a},${a.b})">${svg('check')}</button>`).join('')}</div>
    <div class="ah">Style</div>${opts('style', [['soft','Soft'],['flat','Flat'],['glass','Glass']], L.style)}

$('appearBtn').innerHTML = svg('palette');
$('appearBtn').onclick = e => { e.stopPropagation(); renderAppear(); $('appear').classList.toggle('on'); };
