// ---------- right-click menu + copy / paste ----------
// Copy puts files on the Mac clipboard, so they can be pasted here, in Finder or in Mail.
// Paste and Duplicate only ever make NEW copies. Nothing is moved, renamed or deleted.
const CTX = {items: []};
const isMac = /Mac/.test(navigator.platform);
const K = (k, alt) => isMac ? `${alt?'⌥':''}⌘${k}` : `Ctrl+${alt?'Alt+':''}${k}`;
let clip = {files: [], names: []};
async function readClip(){ try{ const r = await post('/api/clipboard', {}); clip = await r.json(); }catch(e){ clip = {files:[], names:[]}; } return clip; }
const pasteLabel = () => !clip.files.length ? 'Paste' : clip.files.length===1 ? `Paste “${clip.names[0]}”` : `Paste ${clip.files.length} items`;

async function copyFiles(paths){
  const r = await post('/api/copy', {paths}).catch(()=>null);
  const ok = r && r.ok && (await r.json()).ok;
  toast(ok ? (paths.length===1 ? 'Copied. Paste it in a folder here or in Finder' : `Copied ${paths.length} items`) : "Couldn't copy");
}
async function afterMaking(made, verb){
  if(S.view==='browse' && S.browse){ await openFolder(S.browse); }
  api('/api/library?refresh=1').then(fs => { S.files = fs; if(S.view!=='browse') render(); else renderNav(); }).catch(()=>{});
  const f = made && made[0] && byPath().get(made[0]);
  if(f) preview(f);
  toast(made && made.length ? `${verb} “${made[0].split('/').pop()}”${made.length>1?` and ${made.length-1} more`:''}` : 'Done');
}
async function pasteInto(folder){
  if(!folder){ toast('Open a folder first (Places on the left), then paste'); return; }
  toast('Pasting…');
  const r = await post('/api/paste', {path: folder}).catch(()=>null);
  const d = r ? await r.json() : {error:"Couldn't paste"};
  if(!r || !r.ok) return toast(d.error || "Couldn't paste");
  afterMaking(d.made, 'Pasted');
}
async function duplicateFile(path){
  const r = await post('/api/duplicate', {path}).catch(()=>null);
  const d = r ? await r.json() : {};
  if(!r || !r.ok) return toast(d.error || "Couldn't duplicate");
  afterMaking(d.made, 'Made');
}
async function newFolder(folder){
  const r = await post('/api/newfolder', {path: folder}).catch(()=>null);
  const d = r ? await r.json() : {};
  if(!r || !r.ok) return toast(d.error || "Couldn't make a folder");
  await openFolder(folder); toast('New folder made');
}
const copyText = (t, msg) => navigator.clipboard.writeText(t).then(()=>toast(msg)).catch(()=>toast("Couldn't copy"));
const folderName = p => p.split('/').filter(Boolean).pop() || p;

// Build the menu for whatever was right-clicked.
function menuFor(target){
  const fileEl = target.closest('[data-path]');
  const folderEl = target.closest('.ftile[data-browse],[data-place],.crumbs [data-browse]');
  const sortSub = [['recent','Last opened'],['modified','Last changed'],['added','Newest first'],['used','Most used'],['name','Name A–Z'],['size','Biggest']]
    .map(([v,t]) => ({label:t, check:S.sort===v, run:()=>{ S.sort=v; $('sort').value=v; store.set('sort',v); render(); }}));
  const viewSub = [['grid','Grid'],['list','List']].map(([v,t]) => ({label:t, check:S.layout===v, run:()=>{ const b = document.querySelector(`#viewSeg button[data-v="${v}"]`); b && b.click(); }}));
  const general = [
    {icon:'grid', label:'View as', sub:viewSub},
    {icon:'sort', label:'Sort by', sub:sortSub},
    '-',
    {icon:'refresh', label:'Refresh', run:()=>load(true)},
    {icon:'palette', label:'Appearance…', run:()=>{ renderAppear(); $('appear').classList.add('on'); }},
  ];
  if(fileEl && !folderEl){
    const f = byPath().get(fileEl.dataset.path); if(!f) return null;
    const pinned = S.pins.has(f.path);
    return {head:{color:color(f.type), ext:(f.ext||'?').slice(0,4), name:f.name, info:[f.pages?pagesText(f):'', f.size?size(f.size):'', f.folder].filter(Boolean).join(' · ')}, items:[
      {icon:'launch', label:'Open', key:'↵', run:()=>post('/api/launch',{path:f.path})},
      {icon:'open', label:'Quick Look', key:'Space', run:()=>post('/api/quicklook',{path:f.path})},
      {icon:'finder', label:'Show in Finder', run:()=>{ post('/api/reveal',{path:f.path}); toast('Showing in Finder'); }},
      {icon:'info', label:'Get info', run:()=>preview(f)},
      '-',
      {icon:'copy', label:'Copy', key:K('C'), run:()=>copyFiles([f.path])},
      {icon:'pencil', label:'Rename…', run:()=>renameItem(f.path, false)},
      {icon:'dup', label:'Duplicate', key:K('D'), run:()=>duplicateFile(f.path)},
      {icon:'link', label:'Copy path', key:K('C',1), run:()=>copyText(f.path,'Path copied')},
      {icon:'text', label:'Copy name', run:()=>copyText(f.name,'Name copied')},
      '-',
      {icon:'star', label:pinned?'Unpin':'Pin', run:()=>{ togglePin(f.path); render(); if(S.sel===f.path) preview(f); }},
      ...(f.ext==='pdf' ? [{icon:'scissors', label:'Split pages…', run:()=>openSplit(f)}] : []),
      {icon:'folder', label:'Open its folder', run:()=>openFolder(f.path.slice(0, f.path.lastIndexOf('/')))},
    ]};
  }
  if(folderEl){
    const path = folderEl.dataset.browse || folderEl.dataset.place;
    return {head:{folder:true, name:folderName(path), info:path.replace(/^\/Users\/[^/]+/,'~')}, items:[
      {icon:'folder', label:'Open', run:()=>openFolder(path)},
      {icon:'finder', label:'Open in Finder', run:()=>post('/api/launch',{path})},
      '-',
      {icon:'copy', label:'Copy', run:()=>copyFiles([path])},
      ...(folderEl.matches('.ftile') ? [{icon:'pencil', label:'Rename…', run:()=>renameItem(path, true)}] : []),
      {icon:'paste', label:pasteLabel()+' into it', dis:!clip.files.length, run:()=>pasteInto(path)},
      {icon:'newfolder', label:'New folder inside', run:()=>newFolder(path)},
      {icon:'link', label:'Copy path', run:()=>copyText(path,'Path copied')},
    ]};
  }
  const here = S.view==='browse' && !S.q ? S.browse : null;
  return {items: here ? [
      {icon:'paste', label:pasteLabel(), key:K('V'), dis:!clip.files.length, run:()=>pasteInto(here)},
      {icon:'newfolder', label:'New folder', run:()=>newFolder(here)},
      {icon:'finder', label:'Open in Finder', run:()=>post('/api/launch',{path:here})},
      '-', ...general] : general};
}

function itemsHTML(items){
  return items.map((it, i) => {
    if(it==='-') return '<div class="sep"></div>';
    const lead = it.sub ? svg(it.icon) : it.check!=null ? `<span class="chk">${it.check?'✓':''}</span>` : svg(it.icon||'chev');
    return `<div class="ci ${it.dis?'dis':''}" role="menuitem" data-i="${i}">${lead}<span class="lbl">${esc(it.label)}</span>${it.sub?`<span class="k">${svg('chev')}</span><div class="sub"><div class="ctx-in">${itemsHTML(it.sub)}</div></div>`:it.key?`<span class="k">${esc(it.key)}</span>`:''}</div>`;
  }).join('');
}
function openMenu(m, x, y){
  CTX.items = m.items;
  const h = m.head;
  const head = h ? `<div class="ch"><span class="ic" style="background-color:${h.folder?'var(--violet)':h.color}">${h.folder?svg('folder'):esc(h.ext)}</span><div style="min-width:0"><b>${esc(h.name)}</b><small>${esc(h.info||'')}</small></div></div>` : '';
  const el = $('ctx'); el.innerHTML = head + itemsHTML(m.items); el.classList.add('on');
  el.style.left = '0px'; el.style.top = '0px';
  const w = el.offsetWidth, ht = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  el.style.top = Math.max(8, Math.min(y, innerHeight - ht - 8)) + 'px';
  const flip = el.getBoundingClientRect().right + 210 > innerWidth;
  el.querySelectorAll('.sub').forEach(s => s.classList.toggle('left', flip));
}
const closeMenu = () => $('ctx').classList.remove('on');

document.addEventListener('contextmenu', async e => {
  if(e.target.closest('input,textarea,select,.modal,.zoom,#appear,#ctx')) return; // keep the normal menu there
  e.preventDefault();
  $('appear').classList.remove('on');
  const fileEl = e.target.closest('[data-path]');
  if(fileEl && fileEl.matches('.card,.row')){ const f = byPath().get(fileEl.dataset.path); if(f && S.sel!==f.path){ S.sel = f.path; document.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); fileEl.classList.add('sel'); renderStatus(); } }
  const m = menuFor(e.target); if(!m) return;
  openMenu(m, e.clientX, e.clientY);
  // Check what's on the clipboard, then refresh the Paste item.
  const t = e.target; await readClip();
  if($('ctx').classList.contains('on') && m.items.some(it => it.label && it.label.startsWith('Paste'))) openMenu(menuFor(t), e.clientX, e.clientY);
});
$('ctx').addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('.ci'); if(!b || b.classList.contains('dis')) return;
  const sub = b.closest('.sub');
  let it;
  if(sub){ const parent = sub.closest('.ci'); it = CTX.items[+parent.dataset.i].sub[+b.dataset.i]; }
  else { it = CTX.items[+b.dataset.i]; if(it.sub){ b.classList.toggle('open'); if(b.classList.contains('open')) fitSub(b.querySelector('.sub')); return; } }
  closeMenu(); it.run && it.run();
});
$('ctx').addEventListener('mouseover', e => {
  const b = e.target.closest('.ci'); if(!b || b.closest('.sub')) return;
  $('ctx').querySelectorAll(':scope > .ci.open').forEach(x => { if(x!==b) x.classList.remove('open'); });
  const sub = b.querySelector('.sub');
  if(sub && !b.classList.contains('open')){ b.classList.add('open'); fitSub(sub); }
});
// Keep a sub-menu inside the window.
function fitSub(sub){
  sub.style.top = '-7px';
  const r = sub.getBoundingClientRect();
  if(r.bottom > innerHeight - 8) sub.style.top = (-7 - (r.bottom - innerHeight + 8)) + 'px';
}
document.addEventListener('mousedown', e => { if(!e.target.closest('#ctx')) closeMenu(); }, true);
addEventListener('blur', closeMenu); addEventListener('resize', closeMenu);
document.addEventListener('scroll', closeMenu, true);


// ---------- rename (same folder only; never replaces another file) ----------
let RN = null;
function renameItem(path, isFolder){
  const name = path.split('/').pop();
  RN = {path, isFolder};
  $('rnWhere').textContent = 'In ' + path.slice(0, path.lastIndexOf('/')).replace(/^\/Users\/[^/]+/,'~');
  $('rnErr').textContent = '';
  const inp = $('rnInput'); inp.value = name;
  $('rn').classList.add('on'); inp.focus();
  const dot = name.lastIndexOf('.');
  inp.setSelectionRange(0, !isFolder && dot > 0 ? dot : name.length); // select the name, not the .pdf
}
const closeRename = () => { $('rn').classList.remove('on'); RN = null; };
async function saveRename(){
  if(!RN) return;
  const {path} = RN, name = $('rnInput').value.trim();
  if(name === path.split('/').pop()){ closeRename(); return; }
  const r = await post('/api/rename', {path, name}).catch(()=>null);
  const d = r ? await r.json() : {error:"Couldn't rename"};
  if(!r || !r.ok){ $('rnErr').textContent = d.error || "Couldn't rename"; return; }
  const np = d.path, moved = p => p===path ? np : p.startsWith(path+'/') ? np + p.slice(path.length) : p;
  S.pins = new Set([...S.pins].map(moved)); store.set('pins', [...S.pins]);
  const wasSel = S.sel && moved(S.sel)!==S.sel;
  if(S.browse && moved(S.browse)!==S.browse){ S.browse = moved(S.browse); store.set('browse', S.browse); }
  closeRename(); toast(`Renamed to “${name}”`);
  if(S.view==='browse' && S.browse) await openFolder(S.browse);
  api('/api/library?refresh=1').then(fs => { S.files = fs; if(S.view!=='browse') render(); else renderNav();
    const f = wasSel && byPath().get(moved(S.sel)); if(f) preview(f); }).catch(()=>{});
  if(wasSel){ const f = byPath().get(np); if(f) preview(f); else S.sel = np; }
}
$('rnSave').onclick = saveRename;
$('rnCancel').onclick = closeRename;
$('rn').addEventListener('mousedown', e => { if(e.target.id==='rn') closeRename(); });
$('rnInput').addEventListener('keydown', e => {
  if(e.key==='Enter'){ e.preventDefault(); saveRename(); }
  else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeRename(); }
});

// Keyboard: ⌘C copy · ⌘V paste into the open folder · ⌘D duplicate · ⌥⌘C copy path
document.addEventListener('keydown', e => {
  if(e.key==='Escape' && $('ctx').classList.contains('on')){ closeMenu(); e.stopPropagation(); return; }
  if(!(e.metaKey || e.ctrlKey) || e.shiftKey) return;
  if(e.target.closest && e.target.closest('input,textarea,select,.modal')) return;
  if(String(getSelection()).length) return; // let normal text copy work
  const k = e.code;
  if(k==='KeyC' && S.sel){ e.preventDefault(); e.altKey ? copyText(S.sel,'Path copied') : copyFiles([S.sel]); }
  else if(k==='KeyV' && !e.altKey){ e.preventDefault(); readClip().then(() => pasteInto(S.view==='browse' && !S.q ? S.browse : null)); }
  else if(k==='KeyD' && S.sel && !e.altKey){ e.preventDefault(); duplicateFile(S.sel); }
}, true);


document.addEventListener('keydown', e => {
  const typing = !!(e.target.matches && e.target.matches('input,select,textarea'));
  if(e.key==='/' && !typing){ e.preventDefault(); $('q').focus(); }
  else if($('zoom').classList.contains('on')){
    if(e.key==='Escape') closeZoom();
    else if(e.key==='ArrowRight' || e.key==='PageDown') { e.preventDefault(); zoomTo(Z.p+1); }
    else if(e.key==='ArrowLeft' || e.key==='PageUp') { e.preventDefault(); zoomTo(Z.p-1); }
    else if(e.key==='+' || e.key==='=') zoomW(250);
    else if(e.key==='-') zoomW(-250);
  }
  else if(e.key==='Escape'){ if($('splitModal').classList.contains('open')) closeSplit(); else if(typing){ e.target.blur(); } else closePreview(); }
  else if(e.key===' ' && !typing && S.sel){ e.preventDefault(); post('/api/quicklook',{path:S.sel}); }
  else if(e.key==='Enter' && !typing && S.sel){ post('/api/launch',{path:S.sel}); }
});

// ---------- split PDF ----------
const SP = {file:null, n:0, from:1, to:1, anchor:null};
const pageImg = (n, big, file) => `/api/pdfpage?n=${n}${big?'&size=big':''}&path=${encodeURIComponent((file||SP.file).path)}&v=${Math.floor((file||SP.file).modified)}`;
let bigTimer;
function showBig(p){
  // Show the small picture at once, then swap in the sharp one.
  SP.bigPage = p;
  $('spBig').innerHTML = `<img src="${pageImg(p)}" alt="Page ${p}"><span class="lbl">Page ${p}</span>`;
  clearTimeout(bigTimer);
  bigTimer = setTimeout(() => { const im = new Image(); im.onload = () => { if(SP.bigPage===p){ const cur = $('spBig').querySelector('img'); if(cur) cur.src = im.src; } }; im.src = pageImg(p, true); }, 120);
}
async function openSplit(f){
  if(!f) return;
  Object.assign(SP, {file:f, n:0, from:1, to:1, anchor:null});
  $('spName').textContent = f.name;
  $('spBusy').classList.remove('on'); $('spResult').classList.remove('on');
  fillDest(f);
  $('spGrid').innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spin"></div>Making page previews…</div>';
  $('spBig').innerHTML = ''; $('spSum').textContent = ''; $('spQuick').innerHTML = '';
  $('splitModal').classList.add('open');
  try{ SP.n = (await api('/api/pdfpages?path='+encodeURIComponent(f.path))).pages; }
  catch(e){ $('spGrid').innerHTML = empty("Can't read this PDF", 'It may be locked with a password.'); return; }
  SP.to = SP.n;
  $('spFrom').max = $('spTo').max = SP.n;
  const shown = Math.min(SP.n, 400);
  $('spGrid').innerHTML = Array.from({length:shown}, (_, i) => `<div class="pg" data-pg="${i+1}"><div class="im"><img loading="lazy" src="${pageImg(i+1)}" alt=""><button class="zm" data-zoom="${i+1}" title="View full size">${svg('search')}</button></div><div class="no">${i+1}</div></div>`).join('')
    + (SP.n>shown ? `<p class="hint" style="grid-column:1/-1">Showing the first ${shown} of ${SP.n} pages. Type page numbers to pick later pages.</p>` : '');
  const half = Math.ceil(SP.n/2);
  $('spQuick').innerHTML = SP.n>1 ? [
    ['All pages',1,SP.n], ['First half',1,half], ['Second half',half+1,SP.n], ['First page',1,1], ['Last page',SP.n,SP.n]
  ].filter(q=>q[1]<=q[2]).map(q=>`<button class="chip" data-q="${q[1]}-${q[2]}">${q[0]}</button>`).join('') : '';
  updateSplit(1);
}
function updateSplit(focusPage){
  const a = SP.from, b = SP.to;
  $('spFrom').value = a; $('spTo').value = b;
  document.querySelectorAll('.pg').forEach(el => {
    const p = +el.dataset.pg, inside = p>=a && p<=b;
    el.classList.toggle('in', inside); el.classList.toggle('out', !inside);
    el.classList.toggle('edge', p===a || p===b);
  });
  const c = b-a+1;
  $('spSum').textContent = `Pages ${a}–${b} · ${c} page${c>1?'s':''} of ${SP.n}`;
  if(a===b) $('spSum').textContent = `Page ${a} only · 1 page of ${SP.n}`;
  const p = focusPage || a;
  showBig(p);
}
function setRange(a, b, focus){
  a = Math.max(1, Math.min(SP.n, a|0 || 1)); b = Math.max(1, Math.min(SP.n, b|0 || 1));
  if(a > b) [a, b] = [b, a];
  SP.from = a; SP.to = b; updateSplit(focus);
}
function fillDest(f){
  const same = f.path.slice(0, f.path.lastIndexOf('/'));
  const opts = [{v:'', t:'Same folder as the original'}]
    .concat(S.places.filter(p=>p.icon!=='home' && p.icon!=='pictures').map(p=>({v:p.path, t:p.name})))
    .concat(SP.custom ? [{v:SP.custom.path, t:SP.custom.display}] : [])
    .concat([{v:'__choose', t:'Choose another folder…'}]);
  const keep = store.get('splitDest','');
  $('spDest').innerHTML = opts.map(o=>`<option value="${esc(o.v)}">${esc(o.t)}</option>`).join('');
  $('spDest').value = opts.some(o=>o.v===keep) ? keep : '';
  SP.same = same; showDest();
}
function showDest(){
  const v = $('spDest').value;
  const p = v || SP.same;
  $('spDestPath').textContent = p.replace(/^\/Users\/[^/]+/, '~');
}
$('spDest').addEventListener('change', async () => {
  if($('spDest').value === '__choose'){
    $('spDestPath').textContent = 'Pick a folder in the window that opened…';
    let r = null;
    try{ r = await (await post('/api/choosefolder', {})).json(); }catch(e){}
    if(r && r.path){ SP.custom = r; fillDest(SP.file); $('spDest').value = r.path; }
    else $('spDest').value = store.get('splitDest','') || '';
  }
  store.set('splitDest', $('spDest').value); showDest();
});
const Z = {file:null, n:0, p:1, split:false, w:1100};
function openZoom(p, file, n, split){
  Object.assign(Z, {file, n, split}); $('zRangeBtns').style.display = split ? '' : 'none';
  $('zoom').classList.add('on'); zoomTo(p);
}
function zoomTo(p){
  Z.p = Math.max(1, Math.min(Z.n, p));
  $('zLabel').textContent = `${Z.file.name} — page ${Z.p} of ${Z.n}`;
  $('zImg').src = pageImg(Z.p, true, Z.file);
  $('zPrev').disabled = Z.p<=1; $('zNext').disabled = Z.p>=Z.n;
  $('zStage').scrollTop = 0;
  if(Z.p < Z.n){ new Image().src = pageImg(Z.p+1, true, Z.file); }  // get the next page ready
}
function zoomW(d){ Z.w = Math.max(500, Math.min(2400, Z.w + d)); document.documentElement.style.setProperty('--zw', Z.w+'px'); }
function closeZoom(){ $('zoom').classList.remove('on'); }
$('zPrev').onclick = () => zoomTo(Z.p-1);
$('zNext').onclick = () => zoomTo(Z.p+1);
$('zIn').onclick = () => zoomW(250); $('zOut').onclick = () => zoomW(-250);
$('zClose').onclick = closeZoom;
$('zFrom').onclick = () => { SP.anchor=null; setRange(Z.p, Math.max(Z.p, SP.to), Z.p); toast(`Split starts at page ${Z.p}`); };
$('zTo').onclick = () => { SP.anchor=null; setRange(Math.min(SP.from, Z.p), Z.p, Z.p); toast(`Split ends at page ${Z.p}`); };
function closeSplit(){ $('splitModal').classList.remove('open'); }
$('spClose').onclick = closeSplit;
$('splitModal').addEventListener('click', e => { if(e.target.id==='splitModal') closeSplit(); });
$('spGrid').addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]'); if(z){ e.stopPropagation(); openZoom(+z.dataset.zoom, SP.file, SP.n, true); return; }
  const el = e.target.closest('.pg'); if(!el) return;
  const p = +el.dataset.pg;
  if(e.shiftKey || SP.anchor !== null){ setRange(SP.anchor ?? SP.from, p, p); SP.anchor = null; }
  else { SP.anchor = p; setRange(p, p, p); }
});
$('spGrid').addEventListener('mouseover', e => { const el = e.target.closest('.pg'); if(el && +el.dataset.pg !== SP.bigPage) showBig(+el.dataset.pg); });
$('spGrid').addEventListener('dblclick', e => { const el = e.target.closest('.pg'); if(el) openZoom(+el.dataset.pg, SP.file, SP.n, true); });
$('spBig').addEventListener('click', () => SP.bigPage && openZoom(SP.bigPage, SP.file, SP.n, true));
function setTile(t){ document.documentElement.style.setProperty('--tile', t); store.set('tile', t); document.querySelectorAll('#spSize button').forEach(b => b.classList.toggle('on', b.dataset.t===t)); }
document.querySelectorAll('#spSize button').forEach(b => b.onclick = () => setTile(b.dataset.t));
setTile(store.get('tile', '190px'));
$('spFrom').addEventListener('change', () => { SP.anchor = null; setRange($('spFrom').value, Math.max($('spFrom').value, SP.to)); });
$('spTo').addEventListener('change', () => { SP.anchor = null; setRange(Math.min(SP.from, $('spTo').value), $('spTo').value, +$('spTo').value); });
$('spQuick').addEventListener('click', e => { const q = e.target.closest('[data-q]'); if(!q) return; const [a,b] = q.dataset.q.split('-').map(Number); SP.anchor=null; setRange(a,b); });
$('spSave').onclick = async () => {
  const btn = $('spSave'); btn.disabled = true;
  const c = SP.to-SP.from+1;
  $('spBusyText').textContent = `Saving ${c} page${c>1?'s':''} as a new PDF…`;
  $('spBusy').classList.add('on');
  const started = Date.now();
  try{
    const r = await post('/api/split', {path:SP.file.path, from:SP.from, to:SP.to, dest:$('spDest').value || null});
    const d = await r.json();
    if(!r.ok) throw new Error(d.error);
    await new Promise(res => setTimeout(res, Math.max(0, 600-(Date.now()-started))));  // let the loader be seen
    $('spResult').innerHTML = `<div class="rcard">
      <div class="ok">✓</div>
      <h3>New PDF saved</h3>
      <div class="info">${d.pages} page${d.pages>1?'s':''} · from “${esc(SP.file.name)}”</div>
      <div class="rthumb"><img src="/api/thumb?s=360&path=${encodeURIComponent(d.path)}&t=${Date.now()}" alt="" onerror="this.remove()"></div>
      <div class="where"><small>File name</small>${esc(d.name)}</div>
      <div class="where"><small>Saved in</small>${esc(d.folder)}</div>
      <div class="actions">
        <button class="btn primary" data-newfile="${esc(d.path)}" data-do="launch">Open</button>
        <button class="btn" data-newfile="${esc(d.path)}" data-do="reveal">Show in Finder</button>
        <button class="btn" id="spAgain">Split another range</button>
        <button class="btn" id="spFinish">Done</button>
      </div></div>`;
    $('spResult').classList.add('on');
    api('/api/library?refresh=1').then(fs => { S.files = fs; render(); const cur = byPath().get(SP.file.path); if(cur && S.sel===cur.path) preview(cur); }).catch(()=>{});
  }catch(e){ toast('Could not split: '+e.message); }
  $('spBusy').classList.remove('on');
  btn.disabled = false;
};
$('spResult').addEventListener('click', e => {
  const b = e.target.closest('[data-newfile]'); if(b){ post('/api/'+b.dataset.do, {path:b.dataset.newfile}); return; }
  if(e.target.id==='spAgain') $('spResult').classList.remove('on');
  if(e.target.id==='spFinish') closeSplit();
});

api('/api/places').then(p => { S.places = p; renderNav(); }).catch(()=>{});
if(S.view==='browse' && S.browse) openFolder(S.browse);
load();
setInterval(async () => { try{ S.open = await api('/api/open'); if(S.view==='open' && !S.q) render(); else renderNav(); }catch(e){} }, 30000);
</script>
